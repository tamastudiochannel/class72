<!DOCTYPE html>
<html lang="id" data-theme="hut-ri-81">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Status Kelas — Kelas 7.2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/base.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  .status-wrap{ max-width:560px; margin:0 auto; padding:var(--space-6) var(--space-4) var(--space-9); }
  .back-link{ display:inline-flex; align-items:center; gap:6px; font-size:var(--fs-xs); font-weight:var(--fw-semibold); color:var(--color-secondary); margin-bottom:var(--space-5); }
  .page-title{ font-family:var(--font-display); font-size:var(--fs-xl); font-weight:var(--fw-bold); margin-bottom:var(--space-5); }

  .composer{ background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-lg); padding:var(--space-4); margin-bottom:var(--space-6); box-shadow:var(--shadow-sm); }
  .composer textarea{ width:100%; border:none; resize:none; font:inherit; font-size:var(--fs-sm); min-height:56px; background:none; }
  .composer textarea:focus{ outline:none; }
  .composer__row{ display:flex; align-items:center; gap:var(--space-3); border-top:1px solid var(--color-border); padding-top:var(--space-3); margin-top:var(--space-3); }
  .composer__row input{ flex:1; font-size:var(--fs-xs); border:1px solid var(--color-border); border-radius:var(--radius-sm); padding:8px 10px; }
  .composer__row select{ font-size:var(--fs-xs); border:1px solid var(--color-border); border-radius:var(--radius-sm); padding:8px; }
  .btn-post{ padding:9px 20px; border-radius:var(--radius-pill); background:var(--color-primary); color:#fff; font-weight:var(--fw-semibold); font-size:var(--fs-xs); white-space:nowrap; }
  .btn-post:disabled{ opacity:.4; cursor:not-allowed; }

  .status-item{ background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-md); padding:var(--space-4); margin-bottom:var(--space-3); }
  .status-item__head{ display:flex; align-items:center; gap:var(--space-3); margin-bottom:var(--space-3); }
  .status-item__avatar{ width:38px; height:38px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:var(--fw-bold); font-size:var(--fs-xs); color:#fff; background:linear-gradient(135deg,var(--color-secondary),var(--color-primary)); }
  .status-item__meta b{ display:block; font-size:var(--fs-sm); }
  .status-item__meta span{ font-size:var(--fs-2xs); color:var(--color-muted); }
  .status-item__text{ font-size:var(--fs-sm); line-height:var(--lh-relaxed); margin-bottom:var(--space-3); white-space:pre-wrap; }
  .status-item__media{ border-radius:var(--radius-sm); overflow:hidden; margin-bottom:var(--space-3); border:1px solid var(--color-border); }
  .status-item__media img, .status-item__media video{ width:100%; display:block; }
  .status-item__del{ font-size:var(--fs-2xs); color:var(--color-danger); font-weight:var(--fw-semibold); }
  .empty-state{ text-align:center; padding:var(--space-8) var(--space-4); color:var(--color-muted); font-size:var(--fs-sm); }
</style>
</head>
<body>
<div class="status-wrap">
  <a class="back-link" href="index.html">← Kembali ke beranda</a>
  <h1 class="page-title">Status Kelas</h1>

  <div class="composer">
    <textarea id="statusText" placeholder="Lagi mikirin apa nih? (wajib login MyProfil untuk posting)"></textarea>
    <div class="composer__row">
      <input type="url" id="statusImg" placeholder="Link gambar (opsional)">
      <input type="url" id="statusVid" placeholder="Link video (opsional)">
      <button class="btn-post" id="btnPost">Bagikan</button>
    </div>
  </div>

  <div id="feedList"></div>
</div>

<script type="module">
  import { db, ref, push, onValue, remove, serverTimestamp } from '/src/lib/firebase.js';
  import { watchAuthTier, requireTier, TIER_MESSAGE } from '/src/lib/auth-guard.js';

  const feedList = document.getElementById('feedList');
  let currentTier = 'guest';
  let currentProfil = null;

  // Data contoh — di produksi diganti onValue(ref(db,'status_feed'), ...) urut waktu terbaru di atas
  const demoFeed = [
    { name:'Achmad Ikhsan', time:'Baru saja', text:'Siap-siap event turnamen ML tanggal 16 Agustus nanti 🔥', img:'', mine:true },
    { name:'Renai Sistha', time:'2 jam lalu', text:'Reminder: kas minggu ini belum pada bayar ya, ditunggu di myprofil masing-masing 🙏', img:'', mine:false },
  ];

  function renderFeed(items) {
    if (!items.length) {
      feedList.innerHTML = `<div class="empty-state">Belum ada status. Jadi yang pertama share!</div>`;
      return;
    }
    feedList.innerHTML = items.map((s, i) => `
      <div class="status-item">
        <div class="status-item__head">
          <div class="status-item__avatar"><img src="/public/images/default-avatar.png" alt=""></div>
          <div class="status-item__meta"><b>${s.name}</b><span>${s.time}</span></div>
        </div>
        <div class="status-item__text">${s.text}</div>
        ${s.img ? `<div class="status-item__media"><img src="${s.img}" alt=""></div>` : ''}
        ${s.mine ? `<button class="status-item__del" data-i="${i}">Hapus status</button>` : ''}
      </div>
    `).join('');
  }
  renderFeed(demoFeed);

  document.getElementById('btnPost').addEventListener('click', () => {
    if (!requireTier(currentTier, 'verified', () => alert(TIER_MESSAGE.verified))) return;
    const text = document.getElementById('statusText').value.trim();
    if (!text) { alert('Tulis sesuatu dulu ya.'); return; }
    // TODO: push(ref(db,'status_feed'), { uid: currentProfil.uid, name: currentProfil.name,
    //   text, img: ..., vid: ..., createdAt: serverTimestamp() })
    document.getElementById('statusText').value = '';
  });

  feedList.addEventListener('click', (e) => {
    if (e.target.matches('.status-item__del')) {
      // TODO: remove(ref(db, `status_feed/${postId}`)) — hanya untuk pemilik post (ditegakkan di rules.json)
      if (confirm('Hapus status ini?')) e.target.closest('.status-item').remove();
    }
  });

  // Tamu boleh lihat feed sepenuhnya — cuma posting/hapus yang butuh verifikasi MyProfil
  watchAuthTier((tier, profil) => { currentTier = tier; currentProfil = profil; });
</script>
<script type="module" src="/src/components/footer.js"></script>
</body>
</html>
