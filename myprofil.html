<!DOCTYPE html>
<html lang="id" data-theme="hut-ri-81">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyProfil — Kelas 7.2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/base.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  .profile-wrap{ max-width:640px; margin:0 auto; padding:var(--space-7) var(--space-4); }
  .back-link{ display:inline-flex; align-items:center; gap:6px; font-size:var(--fs-xs); font-weight:var(--fw-semibold); color:var(--color-secondary); margin-bottom:var(--space-5); }
  .panel{ background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-lg); box-shadow:var(--shadow-md); overflow:hidden; }
  .panel__header{
    padding:var(--space-6) var(--space-6) var(--space-5); text-align:center; color:#fff;
    background:linear-gradient(120deg,var(--color-secondary-dark),var(--color-primary-dark));
  }
  .panel__avatar{ width:88px; height:88px; border-radius:50%; margin:0 auto var(--space-3); border:4px solid rgba(255,255,255,.35);
    display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:var(--fw-bold); font-size:var(--fs-xl);
    background:rgba(255,255,255,.15); }
  .panel__header b{ font-family:var(--font-display); font-size:var(--fs-lg); }
  .panel__header span{ display:block; font-size:var(--fs-xs); opacity:.75; font-family:var(--font-mono); margin-top:2px; }
  .panel__body{ padding:var(--space-6); }
  .form-row{ margin-bottom:var(--space-5); }
  .form-row label{ display:flex; align-items:center; gap:6px; font-size:var(--fs-xs); font-weight:var(--fw-semibold); margin-bottom:8px; }
  .form-row input, .form-row select, .form-row textarea{
    width:100%; padding:11px 14px; border-radius:var(--radius-sm); border:1px solid var(--color-border); font:inherit; font-size:var(--fs-sm); background:var(--color-bg);
  }
  .form-row input:focus, .form-row select:focus, .form-row textarea:focus{ outline:none; border-color:var(--color-secondary); background:var(--color-surface); }
  .badge-verif{ font-size:var(--fs-2xs); background:color-mix(in srgb, var(--color-warning) 20%, transparent); color:#8a6d00; padding:3px 10px; border-radius:var(--radius-pill); font-weight:var(--fw-semibold); }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0 var(--space-4); }
  .save-bar{ display:flex; justify-content:flex-end; gap:var(--space-3); padding-top:var(--space-4); border-top:1px solid var(--color-border); }
  .btn{ padding:12px 22px; border-radius:var(--radius-sm); font-weight:var(--fw-semibold); font-size:var(--fs-sm); }
  .btn-primary{ background:var(--color-primary); color:#fff; }
  .btn-ghost{ background:var(--color-bg); border:1px solid var(--color-border); }
  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(120%); background:var(--color-ink); color:#fff;
    padding:12px 22px; border-radius:var(--radius-pill); font-size:var(--fs-sm); transition:transform var(--transition-base); z-index:60; }
  .toast.show{ transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="profile-wrap">
  <a class="back-link" href="index.html">← Kembali ke beranda</a>

  <div class="panel">
    <div class="panel__header">
      <div class="panel__avatar" id="mpAvatar"><img src="/public/images/default-avatar.png" alt=""></div>
      <b id="mpName">Memuat...</b>
      <span id="mpNo">No. Absen —</span>
    </div>

    <div class="panel__body">
      <form id="mpForm">
        <div class="form-row">
          <label>Link foto profil</label>
          <input type="url" id="fFoto" placeholder="https://...">
        </div>

        <div class="form-grid">
          <div class="form-row">
            <label>Tanggal lahir</label>
            <input type="date" id="fDob">
          </div>
          <div class="form-row">
            <label>Gender</label>
            <select id="fGender">
              <option value="">Pilih...</option>
              <option value="L">Laki-laki</option>
              <option value="P">Perempuan</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <label>Cita-cita</label>
          <input type="text" id="fCita" placeholder="Contoh: Dokter">
        </div>

        <div class="form-row">
          <label>Akun media sosial <span style="font-weight:400;color:var(--color-muted)">(opsional)</span></label>
          <input type="text" id="fSosmed" placeholder="Contoh: @instagram_kamu">
        </div>

        <div class="form-row">
          <label>Jabatan di kelas <span class="badge-verif">Perlu verifikasi Admin Utama 1</span></label>
          <input type="text" id="fJabatan" placeholder="Contoh: Sekretaris, Bendahara, dll">
        </div>

        <div class="save-bar">
          <button type="button" class="btn btn-ghost" id="btnReset">Batalkan</button>
          <button type="submit" class="btn btn-primary">Simpan Perubahan</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="toast" id="toast">Perubahan tersimpan ✓</div>

<script type="module">
  import { watchAuth, db, ref, get, update } from '/src/lib/firebase.js';

  const $ = (id) => document.getElementById(id);

  // TODO: ganti demo ini dengan data real dari users/{uid} setelah login sungguhan aktif
  const demoProfil = { name: 'Achmad Ikhsan', no: '04', gender: 'L', cita: 'Programmer & game developer', dob: '2013-09-05', foto: '', sosmed: '', jabatan: '' };

  function fillForm(p) {
    // Avatar pakai ikon default kecuali siswa isi link foto sendiri (lihat #fFoto)
    if (p.foto) $('mpAvatar').innerHTML = `<img src="${p.foto}" alt="">`;
    $('mpName').textContent = p.name;
    $('mpNo').textContent = `No. Absen ${p.no}`;
    $('fFoto').value = p.foto || '';
    $('fDob').value = p.dob || '';
    $('fGender').value = p.gender || '';
    $('fCita').value = p.cita || '';
    $('fSosmed').value = p.sosmed || '';
    $('fJabatan').value = p.jabatan || '';
  }
  fillForm(demoProfil);

  $('btnReset').addEventListener('click', () => fillForm(demoProfil));

  $('mpForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = {
      foto: $('fFoto').value.trim(),
      dob: $('fDob').value,
      gender: $('fGender').value,
      cita: $('fCita').value.trim(),
      sosmed: $('fSosmed').value.trim(),
      jabatanRequested: $('fJabatan').value.trim(), // masuk antrian verifikasi, belum langsung tayang
    };
    // TODO: update(ref(db, `users/${uid}/private`), payload)
    // field `jabatanRequested` ditulis ke `verification_requests` terpisah,
    // baru dipindah ke profil publik setelah disetujui Admin Utama 1.

    const t = $('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  });
</script>
</body>
</html>
